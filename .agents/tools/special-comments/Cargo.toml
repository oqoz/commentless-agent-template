[package]
name = "special-comments"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
tempfile = "3"
